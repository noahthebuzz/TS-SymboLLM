name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests -v
